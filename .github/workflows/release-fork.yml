name: Release Fork Build

# Builds the MAA fork release zip on tag push or manual dispatch.
#
# Trigger on tag matching fork versioning scheme: vX.Y.Z-fork.YYYYMMDD
# (see ./VERSION for the canonical version written into the build).
#
# Outputs:
#   - installer/MAA-{tag}-win-x64.zip as a workflow artifact
#   - GitHub Release with the zip attached (on tag push only, not on manual dispatch)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. v6.14.0-fork.20260715). Empty = use ./VERSION file.'
        required: false
        default: ''

permissions:
  contents: write   # needed to create GitHub Release

jobs:
  build-win-x64:
    name: Build fork zip (windows-x64)
    if: github.repository_owner != 'MaaXYZ' && github.repository_owner != 'MaaAssistantArknights'
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Fetch submodules
        shell: bash
        run: bash ./.github/scripts/sync-optional-submodules.sh --init --depth 1 src/MaaUtils 3rdparty/EmulatorExtras

      - name: Determine version
        shell: pwsh
        run: |
          if ("${{ inputs.version }}" -ne '') {
            $ver = "${{ inputs.version }}"
          } elseif ($env:GITHUB_REF_TYPE -eq 'tag') {
            $ver = $env:GITHUB_REF_NAME
          } else {
            $ver = (Get-Content VERSION -Raw).Trim() -split "`r?`n" | Select-Object -First 1
          }
          if ($ver -notmatch '^v\d+(\.\d+){1,3}(-[A-Za-z0-9.-]+)?$') {
            throw "Version '$ver' is not a valid v-prefixed SemVer tag (e.g. v6.14.0-fork.20260715)"
          }
          Write-Host "Building version: $ver"
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache MaaDeps
        id: cache-maadeps
        uses: actions/cache@v4
        with:
          path: ./src/MaaUtils/MaaDeps
          key: ${{ runner.os }}-x64-maadeps-${{ hashFiles('tools/maadeps-download.py') }}

      - name: Bootstrap MaaDeps
        if: steps.cache-maadeps.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/maadeps-download.py x64-windows

      - name: Generate global.json
        shell: bash
        run: |
          echo '{"sdk":{"version":"10.0.203","rollForward":"disable"}}' > global.json

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build release zip
        shell: pwsh
        run: |
          .\tools\release-zip.ps1 -Version $env:VERSION
          if ($LASTEXITCODE) { throw "release-zip.ps1 failed (exit $LASTEXITCODE)" }

      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAA-fork-${{ env.VERSION }}-win-x64
          path: installer/MAA-${{ env.VERSION }}-win-x64.zip
          if-no-files-found: error

      - name: Create GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: installer/MAA-${{ env.VERSION }}-win-x64.zip
          body: |
            ## ${{ env.VERSION }}

            本 fork release 由 `.github/workflows/release-fork.yml` 自动构建。

            - 基于 upstream `dev-v2` + 本仓库 fork 改动
            - 包含本仓库账号轮换等自定义功能
            - 资源（`resource/`）与官方 `MaaResource` 仓库一致

            解压后双击 `MAA.exe` 即可使用。
